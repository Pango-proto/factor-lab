[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-matrix"
version = "0.1.0"
description = "Point-in-time A-share factor research data pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=1.26,<3",
  "pyarrow>=15,<24",
  "polars>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
factor-matrix = "factor_matrix.cli:main"

[tool.setuptools.packages.find]
where = ["src-python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src-python", "."]
markers = ["local_data: verifies excluded real local data/evidence; run in the data-owning workspace"]
